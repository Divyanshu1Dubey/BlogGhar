[build]
builder = "NIXPACKS"
buildCommand = "npx prisma generate && npm run build"

[deploy]
startCommand = "node server.js"
healthcheckPath = "/api/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10

[[services]]
name = "blog-ghar-web"
path = "."
numReplicas = 1

# Reference variables from the PostgreSQL plugin. When you add a Postgres service
# to the Railway project, Railway exposes DATABASE_URL on every service in the
# same project. If you rename the plugin to something other than "Postgres",
# update these references accordingly.
[services.variables]
NODE_ENV = "production"
PORT = "8080"
NEXTAUTH_URL = "${{RAILWAY_PUBLIC_DOMAIN}}"
DATABASE_URL = "${{Postgres.DATABASE_URL}}"
